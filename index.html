<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>xuncha · 寻茶</title>
  <meta name="description" content="寻茶（xuncha）：2025 级软工在读，拆开没文档的黑盒协议，做成几千人顺手在用的软件。" />
  <link rel="icon" href="./assets/img/avatar.jpg" />
  <link rel="preload" href="./assets/fonts/SchibstedGrotesk-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./assets/fonts/JetBrainsMono-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="float-header">
    <nav class="nav-pill" aria-label="主导航">
      <a class="brand-chip" href="#top">
        <img id="nav-avatar" alt="xuncha" width="26" height="26" />
        <span>xuncha</span>
      </a>
      <div class="nav-links">
        <a href="#works">作品</a>
        <a href="#opensource">开源</a>
        <a href="#about">关于</a>
        <a href="#contact">联系</a>
      </div>
      <button type="button" class="theme-chip" id="theme-btn" aria-label="切换深浅色">
        <span aria-hidden="true">◐</span>
      </button>
    </nav>
  </header>

  <main id="top">
    <section class="hero wrap">
      <div class="hero-copy">
        <div class="live-pill reveal-up" style="--d: 0ms">
          <span class="pulse-dot" aria-hidden="true"></span>
          <span id="hero-status"></span>
        </div>

        <h1 class="hero-title">
          <span class="clip-line"><span class="clip-inner" style="--d: 60ms">xuncha</span></span>
          <span class="clip-line"><em class="clip-inner zh-accent" style="--d: 140ms">寻茶</em></span>
        </h1>

        <p class="hero-tagline reveal-up" style="--d: 220ms" id="hero-tagline"></p>

        <div class="hero-metrics reveal-up" style="--d: 300ms" id="hero-metrics"></div>
      </div>

      <div class="hero-card-wrap reveal-up" style="--d: 180ms">
        <div class="profile-card" id="profile-card">
          <div class="pc-head">
            <button type="button" class="pc-avatar-btn" id="avatar-trigger" title="点一下头像">
              <img id="hero-avatar" alt="xuncha 头像" width="76" height="76" />
              <span class="online-ring" aria-hidden="true"></span>
            </button>
            <div class="pc-id">
              <div class="pc-name-row">
                <strong>xunchahaha</strong>
                <a href="https://github.com/xunchahaha" target="_blank" rel="noopener">GitHub ↗</a>
              </div>
              <p>WeFlow 维护者 · 在做 <a href="https://wuuud.com" target="_blank" rel="noopener">wuuud</a></p>
              <div class="pc-quick-tags">
                <span>TypeScript</span>
                <span>Electron</span>
                <span>Python</span>
                <span>协议逆向</span>
              </div>
            </div>
          </div>

          <div class="pc-chart-box">
            <div class="pc-chart-top">
              <span id="chart-readout">5,773 次贡献 · 223 活跃天</span>
              <span class="chart-peak">Peak 357/day</span>
            </div>
            <div class="pc-bars" id="pc-bars" aria-label="过去一年每周提交趋势"></div>
            <div class="pc-axis">
              <span>25.12</span>
              <span>26.03</span>
              <span>26.06</span>
              <span>26.09</span>
              <span>26.11</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="flow-bridge wrap">
      <div class="spine-track" aria-hidden="true">
        <svg viewBox="0 0 24 132" fill="none">
          <path class="spine-bg" d="M12 0 C12 42, 5 68, 12 132" />
          <path class="spine-fg" id="spine-1" d="M12 0 C12 42, 5 68, 12 132" />
        </svg>
      </div>
      <div class="scrub-statement" id="scrub-statement"></div>
    </section>

    <section class="works-section wrap" id="works">
      <div class="works-grid" id="works-grid"></div>
    </section>

    <section class="oss-river" id="opensource">
      <div class="wrap oss-head scroll-reveal">
        <div class="oss-stat">
          <strong>167</strong>
          <span>/ 184 外部仓库 PR 已合入 · 90.8%</span>
        </div>
        <a class="ghost-pill" id="pr-search-link" target="_blank" rel="noopener">查看全部 PR ↗</a>
      </div>

      <div class="marquee-wrap">
        <div class="marquee-track" id="marquee-1"></div>
        <div class="marquee-track is-reverse" id="marquee-2"></div>
      </div>
    </section>

    <section class="about-section wrap" id="about">
      <div class="craft-row" id="craft-cards"></div>
    </section>

    <section class="closing wrap" id="contact">
      <div class="spine-track spine-short" aria-hidden="true">
        <svg viewBox="0 0 24 88" fill="none">
          <path class="spine-bg" d="M12 0 C17 30, 7 58, 12 88" />
          <path class="spine-fg" id="spine-2" d="M12 0 C17 30, 7 58, 12 88" />
        </svg>
      </div>

      <h2 class="closing-title scroll-reveal">找我聊聊，或者一起做点有意思的东西。</h2>
      <div class="contact-pills scroll-reveal" id="contact-pills"></div>

      <button type="button" class="back-top" id="back-top">↑ 回到顶部</button>
    </section>
  </main>

  <dialog class="shot-dialog" id="shot-dialog">
    <div class="dialog-bar">
      <span id="dialog-title"></span>
      <button type="button" id="dialog-close">关闭 ESC</button>
    </div>
    <div class="dialog-img-wrap">
      <img id="dialog-img" alt="" />
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
